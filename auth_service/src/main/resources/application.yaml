server:
  port: ${SERVER_PORT}

spring:
  application:
    name: AUTH-SERVICE
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

services:
  user-service:
    url: ${USER_MICROSERVICE}

jwt:
  secret: ${JWT_SECRET}
  issuer: auth-service
  access-token-expiration-minutes: 30

internal:
  api-key: ${INTERNAL_API_KEY}