apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: spring-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: loza64/user-service:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: SERVER_PORT
              value: "5002"
            - name: DB_URL
              value: "jdbc:postgresql://postgres-service:5432/user_db"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service # DNS interno: http://user-service:5002
  namespace: spring-microservices
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 5002
      targetPort: 5002
