apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: spring-microservices
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: spring-microservices
spec:
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: spring-microservices
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-service
          image: loza64/user-service:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5002
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "5002"
            - name: DB_URL
              value: "jdbc:postgresql://host.minikube.internal:5432/user_db"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            - secretRef:
                name: user-service-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            timeoutSeconds: 3
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 3
            periodSeconds: 15
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service # DNS interno: http://user-service:5002
  namespace: spring-microservices
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 5002
      targetPort: http
